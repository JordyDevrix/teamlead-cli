name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty to use v1.0.0 or Git tag'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Configure Git Author
        run: |
          git config --global user.name "Test Runner"
          git config --global user.email "runner@teamlead.ai"
          git config --global init.defaultBranch main

      - name: Run test suite
        run: |
          go test -v -count=1 ./...

  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    needs: [test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-latest
            archive: teamlead-darwin-arm64.tar.gz
            binary: teamlead
          - os: darwin
            arch: amd64
            runner: macos-13
            archive: teamlead-darwin-amd64.tar.gz
            binary: teamlead
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            archive: teamlead-linux-amd64.tar.gz
            binary: teamlead
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            archive: teamlead-linux-arm64.tar.gz
            binary: teamlead
          - os: windows
            arch: amd64
            runner: windows-latest
            archive: teamlead-windows-amd64.zip
            binary: teamlead.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Determine Version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build standalone binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
            -ldflags="-s -w -X 'github.com/JordyDevrix/teamlead-cli/cmd.Version=${{ steps.ver.outputs.tag }}'" \
            -o staging/teamlead .
          chmod +x staging/teamlead
          cp staging/teamlead staging/teamlead-cli
          cp README.md staging/
          if [ -f LICENSE ]; then cp LICENSE staging/; fi

          # Smoke test when running natively on the host
          if [ "${{ runner.os }}" = "Linux" ] && [ "${{ matrix.arch }}" = "amd64" ]; then
            ./staging/teamlead --version
            ./staging/teamlead --help
          fi
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            ./staging/teamlead --version
            ./staging/teamlead --help
          fi

          tar -czvf "${{ matrix.archive }}" -C staging .
          shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Build standalone binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.arch }}"
          go build -ldflags="-s -w -X 'github.com/JordyDevrix/teamlead-cli/cmd.Version=${{ steps.ver.outputs.tag }}'" -o staging\teamlead.exe .
          Copy-Item staging\teamlead.exe staging\teamlead-cli.exe
          Copy-Item README.md staging\
          if (Test-Path LICENSE) { Copy-Item LICENSE staging\ }

          .\staging\teamlead.exe --version
          .\staging\teamlead.exe --help

          Compress-Archive -Path staging\* -DestinationPath ${{ matrix.archive }} -Force
          $hash = (Get-FileHash -Algorithm SHA256 ${{ matrix.archive }}).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Out-File -Encoding ascii -NoNewline "${{ matrix.archive }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}-archive
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release files and checksums
        run: |
          cd release-assets
          TAG="${{ steps.release_tag.outputs.tag }}"

          # Create versioned copies alongside standard ones
          for f in teamlead-*.tar.gz; do
            if [ -f "$f" ]; then
              cp "$f" "teamlead-${TAG}-${f#teamlead-}"
            fi
          done
          for f in teamlead-*.zip; do
            if [ -f "$f" ]; then
              cp "$f" "teamlead-${TAG}-${f#teamlead-}"
            fi
          done

          # Clean individual sha256 files
          rm -f *.sha256

          # Generate unified checksums.txt for all release packages
          shasum -a 256 teamlead-* > checksums.txt

          echo "=== Release Assets ==="
          ls -la
          echo "=== Checksums ==="
          cat checksums.txt

      - name: Copy installer scripts into release assets
        run: |
          cp install.sh release-assets/install.sh
          cp install.ps1 release-assets/install.ps1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Release ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
